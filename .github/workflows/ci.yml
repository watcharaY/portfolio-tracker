name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 1 * * 1" # Monday 08:00 Asia/Bangkok — catch newly published vulnerabilities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (vet, test, migrate)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio?sslmode=disable
      TEST_DATABASE_URL: postgres://portfolio:portfolio@localhost:5432/portfolio?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated sqlc code is current
        run: make sqlc-check
      - run: make vet
      - name: Migrations apply on a fresh database
        run: cd backend && go run ./cmd/server migrate
      - run: make test GOTESTFLAGS=-race

  web:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make typecheck
      - run: make build-web
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: backend/internal/platform/webui/dist
          retention-days: 1

  build:
    name: Single binary
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: backend/internal/platform/webui/dist
      - name: Build with the SPA embedded
        run: cd backend && CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o portfolio-tracker ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-tracker-linux-amd64
          path: backend/portfolio-tracker
          retention-days: 7

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: make vulncheck
