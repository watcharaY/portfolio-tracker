openapi: 3.0.3
info:
  title: Portfolio Tracker API
  version: "1.0"
  description: |
    Every amount of money is an integer number of satang (100 = ฿1.00) and every
    interest rate is in basis points (250 = 2.5%). Computed fields such as P/L and
    percentages are read-only.

    Sign in through `POST /auth/login`; the session cookie `pt_session` then
    authenticates every other call. Until the seeded admin changes its password,
    data endpoints answer 403 `PASSWORD_CHANGE_REQUIRED`. `POST` and `PUT` bodies
    must be sent as `application/json`.
servers:
  - url: /api
security:
  - session: []
tags:
  - name: auth
  - name: dashboard
  - name: brokerage
  - name: funds
  - name: pvd
  - name: savings
  - name: insurance
  - name: salary
  - name: docs

paths:
  /health:
    get:
      tags: [auth]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: The API is up.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok: { type: boolean }

  /ready:
    get:
      tags: [auth]
      summary: Readiness check
      description: Pings the database with a 2 s timeout. Docker's healthcheck (`server healthcheck`) calls this.
      security: []
      responses:
        "200":
          description: The API can reach its database.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok: { type: boolean }
        "503":
          description: The database is unreachable. The cause is logged, not returned.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in and receive the session cookie
      description: Rate limited to 10 requests per minute per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in. The response sets the `pt_session` cookie.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      tags: [auth]
      summary: The signed-in user
      description: Works while a password change is still pending.
      responses:
        "200":
          description: Current user.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      summary: End the current session
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Signed out and the cookie is cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /auth/password:
    post:
      tags: [auth]
      summary: Change the password
      description: |
        Revokes every other session of the user. Works while a password change is
        pending. Rate limited to 10 requests per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        "200":
          description: Password changed.
          content: { application/json: { schema: { $ref: "#/components/schemas/User" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /dashboard:
    get:
      tags: [dashboard]
      summary: Portfolio totals per asset class
      responses:
        "200":
          description: Totals, P/L and allocation.
          content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

