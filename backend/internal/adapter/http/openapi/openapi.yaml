      tags: [salary]
      summary: Replace a salary month
      requestBody: { $ref: "#/components/requestBodies/SalaryMonth" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/SalaryMonth" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      tags: [salary]
      summary: Delete a salary month
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tax-deductions:
    get:
      tags: [salary]
      summary: List tax deductions
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: Deductions., content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaxDeduction" } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [salary]
      summary: Add a tax deduction
      requestBody: { $ref: "#/components/requestBodies/TaxDeduction" }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: "#/components/schemas/TaxDeduction" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /tax-deductions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [salary]
      summary: Get a tax deduction
      responses:
        "200": { description: Deduction., content: { application/json: { schema: { $ref: "#/components/schemas/TaxDeduction" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [salary]
      summary: Replace a tax deduction
      requestBody: { $ref: "#/components/requestBodies/TaxDeduction" }
      responses:
        "200": { description: Updated., content: { application/json: { schema: { $ref: "#/components/schemas/TaxDeduction" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    delete:
      tags: [salary]
      summary: Delete a tax deduction
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /openapi.yaml:
    get:
      tags: [docs]
      summary: This document
      responses:
        "200": { description: OpenAPI document., content: { application/yaml: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /docs:
    get:
      tags: [docs]
      summary: Swagger UI for this document
      responses:
        "200": { description: HTML page., content: { text/html: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pt_session

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }

  responses:
    BadRequest:
      description: Invalid JSON, unknown field, wrong type or a failed validation. `field` names the offending field when known.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: No valid session, or wrong username or password.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: The password must be changed first (`PASSWORD_CHANGE_REQUIRED`).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: No row with this id.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: A unique value already exists, or the referenced parent row does not.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedMediaType:
      description: The body was not sent as application/json.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Rate limit reached; retry after a minute.

  requestBodies:
    Broker:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/BrokerInput" } } }
    BrokerTransaction:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/BrokerTransactionInput" } } }
    Fund:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/FundInput" } } }
    PvdYear:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/PvdYearInput" } } }
    SavingsAccount:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/SavingsAccountInput" } } }
    Insurer:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/InsurerInput" } } }
    InsurancePayment:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/InsurancePaymentInput" } } }
    SalaryMonth:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/SalaryMonthInput" } } }
    TaxDeduction:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/TaxDeductionInput" } } }

  # Inputs: a missing or null field counts as zero or empty, which is how the web
  # app sends blank cells. Unknown fields are rejected.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        field: { type: string, description: "The offending field, when known." }

    User:
      type: object
      additionalProperties: false
      required: [id, username, mustChangePassword]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        mustChangePassword: { type: boolean }

    Satang:
      type: integer
      format: int64
      description: Money in satang (100 = ฿1.00).
    Ratio:
      type: number
      nullable: true
      description: A fraction (0.05 = 5%); null when the base is zero.
    Timestamp:
      type: string
      format: date-time

    AssetClass:
      type: object
      additionalProperties: false
      required: [key, label, value, cost, pl, plPct, allocationPct]
      properties:
        key: { type: string, enum: [stocks, funds, pvd, savings, insurance, total] }
        label: { type: string }
        value: { $ref: "#/components/schemas/Satang" }
        cost: { $ref: "#/components/schemas/Satang" }
        pl: { $ref: "#/components/schemas/Satang" }
        plPct: { $ref: "#/components/schemas/Ratio" }
        allocationPct: { $ref: "#/components/schemas/Ratio" }
    Dashboard:
      type: object
      additionalProperties: false
      required: [total, classes, estSavingsInterestPerYear]
      properties:
        total: { $ref: "#/components/schemas/AssetClass" }
        classes: { type: array, items: { $ref: "#/components/schemas/AssetClass" } }
        estSavingsInterestPerYear: { $ref: "#/components/schemas/Satang" }

    BrokerInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, nullable: true }
        current_value: { type: integer, format: int64, nullable: true, minimum: 0 }
        note: { type: string, nullable: true }
    Broker:
      type: object
      additionalProperties: false
      required: [id, name, current_value, note, deposits, withdrawals, net_capital, unrealised_pl, pl_pct, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        current_value: { $ref: "#/components/schemas/Satang" }
        note: { type: string }
        deposits: { $ref: "#/components/schemas/Satang" }
        withdrawals: { $ref: "#/components/schemas/Satang" }
        net_capital: { $ref: "#/components/schemas/Satang" }
        unrealised_pl: { $ref: "#/components/schemas/Satang" }
        pl_pct: { $ref: "#/components/schemas/Ratio" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    BrokerTransactionInput:
      type: object
      additionalProperties: false
      properties:
        broker_id: { type: integer, format: int64, nullable: true }
        txn_date: { type: string, format: date, nullable: true }
        type: { type: string, nullable: true, description: "deposit or withdraw" }
        amount: { type: integer, format: int64, nullable: true }
        note: { type: string, nullable: true }
    BrokerTransaction:
      type: object
      additionalProperties: false
      required: [id, broker_id, broker_name, txn_date, type, amount, note, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        broker_id: { type: integer, format: int64 }
        broker_name: { type: string }
        txn_date: { type: string, format: date, nullable: true }
        type: { type: string, enum: [deposit, withdraw] }
        amount: { $ref: "#/components/schemas/Satang" }
        note: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    FundInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, nullable: true }
        category: { type: string, nullable: true, description: "Equity, Fixed Income, Money Market, Mixed, Gold, SSF, RMF, ThaiESG or Other" }
        cost: { type: integer, format: int64, nullable: true }
        market_value: { type: integer, format: int64, nullable: true }
        note: { type: string, nullable: true }
    Fund:
      type: object
      additionalProperties: false
      required: [id, name, category, cost, market_value, unrealised_pl, pl_pct, note, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        category: { type: string, enum: [Equity, Fixed Income, Money Market, Mixed, Gold, SSF, RMF, ThaiESG, Other] }
        cost: { $ref: "#/components/schemas/Satang" }
        market_value: { $ref: "#/components/schemas/Satang" }
        unrealised_pl: { $ref: "#/components/schemas/Satang" }
        pl_pct: { $ref: "#/components/schemas/Ratio" }
        note: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    PvdYearInput:
      type: object
      additionalProperties: false
      properties:
        year: { type: integer, nullable: true }
        self_contribution: { type: integer, format: int64, nullable: true }
        company_contribution: { type: integer, format: int64, nullable: true }
        self_profit: { type: integer, format: int64, nullable: true }
        company_profit: { type: integer, format: int64, nullable: true }
        fund_allocation: { type: string, nullable: true }
    PvdYear:
      type: object
      additionalProperties: false
      required: [id, year, self_contribution, company_contribution, self_profit, company_profit, fund_allocation, total_contribution, total_profit, value, return_pct, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        year: { type: integer }
        self_contribution: { $ref: "#/components/schemas/Satang" }
        company_contribution: { $ref: "#/components/schemas/Satang" }
        self_profit: { $ref: "#/components/schemas/Satang" }
        company_profit: { $ref: "#/components/schemas/Satang" }
        fund_allocation: { type: string }
        total_contribution: { $ref: "#/components/schemas/Satang" }
        total_profit: { $ref: "#/components/schemas/Satang" }
        value: { $ref: "#/components/schemas/Satang" }
        return_pct: { $ref: "#/components/schemas/Ratio" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    SavingsAccountInput:
      type: object
      additionalProperties: false
      properties:
        bank: { type: string, nullable: true }
        balance: { type: integer, format: int64, nullable: true }
        interest_bp: { type: integer, nullable: true, description: Basis points (250 = 2.5%). }
        note: { type: string, nullable: true }
    SavingsAccount:
      type: object
      additionalProperties: false
      required: [id, bank, balance, interest_bp, note, interest_per_year, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        bank: { type: string }
        balance: { $ref: "#/components/schemas/Satang" }
        interest_bp: { type: integer, minimum: 0, maximum: 10000 }
        note: { type: string }
        interest_per_year: { $ref: "#/components/schemas/Satang" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    InsurerInput:
      type: object
      additionalProperties: false
      properties:
        company: { type: string, nullable: true }
        note: { type: string, nullable: true }
    Insurer:
      type: object
      additionalProperties: false
      required: [id, company, note, payments, total_paid, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        company: { type: string }
        note: { type: string }
        payments: { type: integer }
        total_paid: { $ref: "#/components/schemas/Satang" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    InsurancePaymentInput:
      type: object
      additionalProperties: false
      properties:
        insurer_id: { type: integer, format: int64, nullable: true }
        year: { type: integer, nullable: true }
        premium: { type: integer, format: int64, nullable: true }
        note: { type: string, nullable: true }
    InsurancePayment:
      type: object
      additionalProperties: false
      required: [id, insurer_id, year, premium, note, company, payment_no, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        insurer_id: { type: integer, format: int64 }
        year: { type: integer, nullable: true }
        premium: { $ref: "#/components/schemas/Satang" }
        note: { type: string }
        company: { type: string }
        payment_no: { type: integer, description: 1-based order of the payment within its insurer. }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    SalaryMonthInput:
      type: object
      additionalProperties: false
      properties:
        year: { type: integer, nullable: true }
        month: { type: integer, nullable: true }
        salary: { type: integer, format: int64, nullable: true }
        bonus: { type: integer, format: int64, nullable: true }
        withholding_tax: { type: integer, format: int64, nullable: true }
        pvd: { type: integer, format: int64, nullable: true }
        sso: { type: integer, format: int64, nullable: true }
    SalaryMonth:
      type: object
      additionalProperties: false
      required: [id, year, month, salary, bonus, withholding_tax, pvd, sso, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        salary: { $ref: "#/components/schemas/Satang" }
        bonus: { $ref: "#/components/schemas/Satang" }
        withholding_tax: { $ref: "#/components/schemas/Satang" }
        pvd: { $ref: "#/components/schemas/Satang" }
        sso: { $ref: "#/components/schemas/Satang" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    TaxDeductionInput:
      type: object
      additionalProperties: false
      properties:
        year: { type: integer, nullable: true }
        item: { type: string, nullable: true }
        amount: { type: integer, format: int64, nullable: true }
    TaxDeduction:
      type: object
      additionalProperties: false
      required: [id, year, item, amount, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        year: { type: integer }
        item: { type: string }
        amount: { $ref: "#/components/schemas/Satang" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
